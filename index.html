<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAPD // Command System</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121820; --panel2:#161e28; --line:#233042;
  --amber:#f0a83c; --blue:#4c8fd6; --green:#3fb96f; --red:#e05a5a; --text:#dbe3ec; --dim:#7f8fa3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;min-height:100%}
.mono{font-family:'Consolas',monospace}
#nav{width:210px;background:var(--panel);border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;padding:14px 0;overflow-y:auto}
#nav .brand{padding:0 16px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
#nav .brand b{color:var(--amber);font-size:19px;letter-spacing:.5px}
#nav .brand div{color:var(--dim);font-size:11px;margin-top:2px}
#nav button{all:unset;cursor:pointer;padding:10px 16px;font-size:14px;color:var(--dim);border-left:3px solid transparent}
#nav button:hover{background:var(--panel2);color:var(--text)}
#nav button.active{background:var(--panel2);color:var(--amber);border-left-color:var(--amber)}
#nav .logout{margin-top:auto;padding:10px 16px;color:var(--red);cursor:pointer;font-size:13px;border-top:1px solid var(--line)}
main{flex:1;padding:22px 26px;overflow-y:auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.card .n{font-size:26px;font-weight:700}
.card .l{color:var(--dim);font-size:12px;margin-top:2px}
.status-on{color:var(--green)} .status-off{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:var(--panel2)}
.tblwrap{overflow-x:auto;margin-bottom:18px}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;display:inline-block}
.pill.duty{background:#123a24;color:var(--green)} .pill.off{background:#2a2a2a;color:var(--dim)}
.pill.leave{background:#3a2f10;color:var(--amber)} .pill.high{background:#3a1414;color:var(--red)}
.pill.med{background:#3a2f10;color:var(--amber)} .pill.low{background:#123a24;color:var(--green)}
.pill.active{background:#3a1414;color:var(--red)} .pill.avail{background:#123a24;color:var(--green)}
.pill.use{background:#3a2f10;color:var(--amber)} .pill.maint{background:#232323;color:var(--dim)}
.pill.pending{background:#3a1414;color:var(--red)} .pill.officer{background:#123a24;color:var(--green)} .pill.admin{background:#123a5a;color:var(--blue)}
form.inline{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:4px;font-size:13px;font-family:inherit}
textarea{width:100%;min-height:50px}
button.btn{background:var(--amber);color:#241a06;border:none;padding:7px 14px;border-radius:4px;font-weight:600;cursor:pointer;font-size:13px}
button.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.btn.danger{background:var(--red);color:#2a0d0d}
.del{cursor:pointer;color:var(--red);font-size:12px}
.divtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.divtabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:14px;cursor:pointer;font-size:12px}
.divtabs button.on{background:var(--amber);color:#241a06;border-color:var(--amber)}
.note{color:var(--dim);font-size:12px;margin:8px 0}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin-bottom:16px;font-size:12px;color:var(--dim)}
#topbar b{color:var(--text)}
#topbar select{padding:3px 6px;font-size:11px}
.rolepill{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.role-admin{background:#123a5a;color:var(--blue)} .role-officer{background:#123a24;color:var(--green)}
.ro-banner{background:#3a2f10;border:1px solid var(--amber);color:var(--amber);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px}
#authwrap{flex:1;display:flex;align-items:center;justify-content:center}
#authbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;width:100%;max-width:340px}
#authbox h2{margin:0 0 4px;color:var(--amber)}
#authbox input{width:100%;margin-bottom:10px}
#authbox button{width:100%}
#autherr{color:var(--red);font-size:12px;margin:6px 0}
.switch{color:var(--dim);font-size:12px;margin-top:10px;cursor:pointer;text-align:center}
#toasts{position:fixed;top:14px;right:14px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:300px}
.toast{background:var(--panel2);border:1px solid var(--amber);border-left:4px solid var(--amber);padding:10px 12px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px #0008}
.toast.high{border-color:var(--red)}
.ptt{width:100%;max-width:360px;padding:26px;font-size:16px;font-weight:700;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.ptt.on{background:var(--red);color:#fff;border-color:var(--red)}
.ptt.glob{border-color:var(--amber);padding:16px;font-size:14px}
.sbgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bcslot video{width:100%;max-width:480px;border-radius:6px;background:#000;margin-top:8px}
.bcrow{border-top:1px solid var(--line);padding:10px 0}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="authwrap" style="display:none">
  <div id="authbox"></div>
</div>
<nav id="nav" style="display:none">
  <div class="brand"><b>🚔 SAPD</b><div>Command System</div></div>
  <button data-t="dash" class="active">Dashboard</button>
  <button data-t="members">Members</button>
  <button data-t="mdt">MDT Database</button>
  <button data-t="dispatch">Dispatch</button>
  <button data-t="radio">Radio &amp; Alerts</button>
  <button data-t="bodycam">Bodycam</button>
  <button data-t="reports">Police Reports</button>
  <button data-t="divisions">Divisions</button>
  <button data-t="equip">Equipment / Armory</button>
  <button data-t="vehicles">Vehicles</button>
  <button data-t="academy">Academy</button>
  <button data-t="command">Command Panel</button>
  <div class="logout" onclick="doLogout()">Logout</div>
</nav>
<main id="main" style="display:none">
<div id="topbar"></div>
<div id="content"></div>
</main>

    g.gain.setValueAtTime(v,t0+st);g.gain.setValueAtTime(v,t0+st+d-.02);g.gain.linearRampToValueAtTime(.0001,t0+st+d);
    o.connect(g);g.connect(a.destination);o.start(t0+st);o.stop(t0+st+d);end=Math.max(end,st+d);});
  setTimeout(()=>a.close(),(end+.4)*1000);}catch(e){}}
function playSound(n){if(muted)return;if(SND[n]){try{const a=new Audio(SND[n]);a.volume=.9;a.play().catch(()=>{});}catch(e){}}else synth(n);}
function toast(html,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.innerHTML=html;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),10000);}

// ================= RADIO (walkie-talkie push-to-talk) =================
let txing=false,wantTx=false,txFreq=null,rec=null,micStream=null,chunks=[],txTimer=null,rxQueue=[],rxPlaying=false,rxNow='',radioLog=[];
function logRadio(t){radioLog=[t,...radioLog].slice(0,8);}
function getFreq(){
  if(state.freq)return state.freq;
  try{const f=localStorage.getItem('sapd_freq_'+me.uid);if(f&&FREQS.find(x=>x.id===f)){state.freq=f;return f;}}catch(e){}
  return null;
}
window.setFreq=(id)=>{if(!id)return;state.freq=id;try{localStorage.setItem('sapd_freq_'+me.uid,id);}catch(e){}radioChirp('open');renderView(true);};
let rctx=null;
function RC(){if(!rctx)rctx=new (window.AudioContext||window.webkitAudioContext)();if(rctx.state==='suspended')rctx.resume();return rctx;}
function noiseBuf(c,dur){const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*dur)),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function radioChirp(kind){if(muted)return;try{
  const c=RC(),t=c.currentTime;
  const tone=(f,st,d,v)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,t+st);g.gain.linearRampToValueAtTime(.0001,t+st+d);o.connect(g);g.connect(c.destination);o.start(t+st);o.stop(t+st+d);};
  const hiss=(st,d,v)=>{const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=noiseBuf(c,d);f.type='bandpass';f.frequency.value=2000;g.gain.setValueAtTime(v,t+st);g.gain.linearRampToValueAtTime(.0001,t+st+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t+st);};
  if(kind==='open'){tone(1500,0,.07,.18);hiss(0,.09,.12);}
  else if(kind==='close'){tone(1100,0,.08,.16);tone(800,.09,.06,.12);hiss(.12,.18,.16);}
  else if(kind==='rxopen'){hiss(0,.11,.12);tone(1300,.02,.05,.1);}
}catch(e){}}
function b64ToBuf(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer;}
function distCurve(k){const n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x));}return c;}
async function playRadio(dataUrl,done){
  try{
    const c=RC(),buf=await c.decodeAudioData(b64ToBuf(dataUrl)),src=c.createBufferSource();src.buffer=buf;
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
    const ws=c.createWaveShaper();ws.curve=distCurve(40);
    const cp=c.createDynamicsCompressor(),g=c.createGain();g.gain.value=1.4;
    src.connect(hp);hp.connect(lp);lp.connect(ws);ws.connect(cp);cp.connect(g);g.connect(c.destination);
    const n=c.createBufferSource();n.buffer=noiseBuf(c,buf.duration+.05);
    const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1800;
    const ng=c.createGain();ng.gain.value=.03;n.connect(nf);nf.connect(ng);ng.connect(c.destination);
    src.onended=()=>{radioChirp('close');done();};
    n.start();src.start();
  }catch(e){done();}
}
window.startTx=async(e,target)=>{
  if(e&&e.preventDefault)e.preventDefault();
  if(txing||wantTx)return;
  const fq=target==='global'?'01':getFreq();
  if(!fq){toast('<b>📻 Select your frequency first</b>');return;}
  wantTx=true;
  try{
    if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    if(!wantTx)return;
    radioChirp('open');await new Promise(r=>setTimeout(r,140));
    if(!wantTx)return;
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    rec=new MediaRecorder(micStream,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});
    chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
    rec.onstop=()=>sendClip(fq);
    rec.start();txing=true;txFreq=fq;txTimer=setTimeout(stopTx,30000);renderView(true);
  }catch(err){wantTx=false;toast('<b>Microphone unavailable</b><br><span class="note">'+esc(err.name||err.message)+'</span>');}
};
window.stopTx=()=>{wantTx=false;clearTimeout(txTimer);if(txing&&rec&&rec.state!=='inactive'){rec.stop();radioChirp('close');}txing=false;renderView(true);};
function sendClip(fq){
  const blob=new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/webm'});if(blob.size<1500)return;
  const fr=new FileReader();
  fr.onload=async()=>{const audio=fr.result;if(audio.length>900000){toast('<b>Transmission too long</b>');return;}
    const r=await addDoc(collection(fdb,'radio'),{freq:fq,name:me.name,by:me.uid,ts:Date.now(),audio});
    logRadio('🎙️ You ['+freqLabel(fq)+']');renderView();setTimeout(()=>deleteDoc(r).catch(()=>{}),60000);};
  fr.readAsDataURL(blob);
}
function receiveRadio(d){
  if(d.by===me.uid||muted)return;
  const f=getFreq();if(!f)return;
  if(d.freq!=='01'&&d.freq!==f)return;
  rxQueue.push(d);pumpRx();
}
function pumpRx(){
  if(rxPlaying||!rxQueue.length)return;const d=rxQueue.shift();
  rxPlaying=true;rxNow=d.name+' ('+freqLabel(d.freq)+')';logRadio('🔊 '+d.name+' ['+freqLabel(d.freq)+']');renderView();
  radioChirp('rxopen');
  setTimeout(()=>playRadio(d.audio,()=>{rxPlaying=false;rxNow='';renderView();pumpRx();}),160);
}
document.addEventListener('pointerup',()=>{if(txing||wantTx)stopTx();});
document.addEventListener('keydown',e=>{if(e.repeat||state.tab!=='radio'||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.code==='KeyT')startTx(null,'own');else if(e.code==='KeyG')startTx(null,'global');});
document.addEventListener('keyup',e=>{if((e.code==='KeyT'||e.code==='KeyG')&&(txing||wantTx))stopTx();});

const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
let bcStream=null,bcHB=null,bcHostUnsub=null,bcPCs={},bcUnsubs=[];
const bcViews={},bcVideos={};
const bcLocal=document.createElement('video');bcLocal.muted=true;bcLocal.autoplay=true;bcLocal.playsInline=true;
window.startBodycam=async(kind)=>{
  if(bcStream)return;
  try{bcStream=kind==='screen'?await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}):await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:true});}
  catch(e){toast('<b>Could not start bodycam</b><br><span class="note">'+esc(e.name||e.message)+'</span>');return;}
  bcLocal.srcObject=bcStream;
  const vt=bcStream.getVideoTracks()[0];if(vt)vt.onended=()=>stopBodycam();
  const ref=doc(fdb,'bodycams',me.uid);
  await setDoc(ref,{name:me.name,source:kind,live:true,ts:Date.now()});
  bcHB=setInterval(()=>updateDoc(ref,{ts:Date.now()}).catch(()=>{}),30000);
  bcHostUnsub=onSnapshot(collection(fdb,'bodycams',me.uid,'calls'),snap=>snap.docChanges().forEach(ch=>{
    const d=ch.doc.data();
    if(ch.type==='added'&&d.offer&&!d.answer)hostAnswer(ch.doc);
    if(ch.type==='removed'&&bcPCs[ch.doc.id]){bcPCs[ch.doc.id].close();delete bcPCs[ch.doc.id];}}));
  log(me.name+' started bodycam');renderView(true);
};
async function hostAnswer(cd){
  try{
    const pc=new RTCPeerConnection(ICE);bcPCs[cd.id]=pc;
    bcStream.getTracks().forEach(t=>pc.addTrack(t,bcStream));
    pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(cd.ref,'hostCand'),e.candidate.toJSON());};
    await pc.setRemoteDescription(cd.data().offer);
    const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    await updateDoc(cd.ref,{answer:{type:ans.type,sdp:ans.sdp}});
    bcUnsubs.push(onSnapshot(collection(cd.ref,'viewerCand'),s=>s.docChanges().forEach(c=>{if(c.type==='added')pc.addIceCandidate(c.doc.data()).catch(()=>{});})));
  }catch(e){}
}
window.stopBodycam=async()=>{
  if(!bcStream)return;
  bcStream.getTracks().forEach(t=>t.stop());bcStream=null;bcLocal.srcObject=null;
  clearInterval(bcHB);if(bcHostUnsub)bcHostUnsub();bcUnsubs.forEach(u=>u());bcUnsubs=[];
  Object.values(bcPCs).forEach(p=>p.close());bcPCs={};
  try{await deleteDoc(doc(fdb,'bodycams',me.uid));}catch(e){}
  log(me.name+' stopped bodycam');renderView(true);
};
window.watchCam=async(hostUid)=>{
  if(bcViews[hostUid])return;
  try{
    const pc=new RTCPeerConnection(ICE),callId=me.uid+'_'+Date.now();
    const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.controls=true;
    const ms=new MediaStream();v.srcObject=ms;bcVideos[hostUid]=v;
    pc.ontrack=e=>{ms.addTrack(e.track);v.play().catch(()=>{});};
    pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});
    const ref=doc(fdb,'bodycams',hostUid,'calls',callId),view={pc,ref,unsubs:[],got:false};bcViews[hostUid]=view;
    pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(ref,'viewerCand'),e.candidate.toJSON());};
    const off=await pc.createOffer();await pc.setLocalDescription(off);
    await setDoc(ref,{offer:{type:off.type,sdp:off.sdp},viewer:me.name});
    view.unsubs.push(onSnapshot(ref,async s=>{const d=s.data();
      if(d&&d.answer&&!view.got){view.got=true;await pc.setRemoteDescription(d.answer);
        view.unsubs.push(onSnapshot(collection(ref,'hostCand'),c=>c.docChanges().forEach(x=>{if(x.type==='added')pc.addIceCandidate(x.doc.data()).catch(()=>{});})));}}));
    renderView(true);
  }catch(e){toast('<b>Could not open feed</b>');delete bcViews[hostUid];delete bcVideos[hostUid];renderView(true);}
};
window.unwatchCam=async(hostUid)=>{
  const v=bcViews[hostUid];if(!v)return;
  v.unsubs.forEach(u=>u());v.pc.close();try{await deleteDoc(v.ref);}catch(e){}
  delete bcViews[hostUid];delete bcVideos[hostUid];renderView(true);
};

function subscribeAll(){
  subs.forEach(u=>u());subs=[];
  COLS.forEach(c=>{let first=true;subs.push(onSnapshot(collection(fdb,c),snap=>{
    cache[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!first)snap.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d=ch.doc.data();
      if(c==='dispatch')notify(d);else if(c==='mdt'&&d.wanted)alertSimple('bolo','WANTED: '+esc(d.name)+'<br><span class="note">'+esc(d.criminal||'')+'</span>');});
    first=false;renderView();}));});
  subs.push(onSnapshot(collection(fdb,'users'),snap=>{cache.users=snap.docs.map(d=>({id:d.id,...d.data()}));renderView();}));
  let metaFirst=true;
  subs.push(onSnapshot(doc(fdb,'meta','app'),s=>{if(s.exists()){const d=s.data();
    if(!metaFirst){
      if(d.announcement!==undefined&&d.announcement!==meta.announcement)alertSimple('chime','New announcement<br><span class="note">'+esc(d.announcement)+'</span>');
      if(d.online!==undefined&&d.online!==meta.online)alertSimple('general','SAPD is now '+(d.online?'ONLINE':'OFFLINE'));}
    meta={...meta,...d};}
    metaFirst=false;renderView();}));
  subs.push(onSnapshot(doc(fdb,'admin_log','log'),s=>{if(s.exists())admin={...admin,...s.data()};renderView();}));
  ['alerts','radio'].forEach(c=>{let first=true;subs.push(onSnapshot(collection(fdb,c),snap=>{
    snap.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d=ch.doc.data();
      if(first){if(Date.now()-(d.ts||0)>120000)deleteDoc(ch.doc.ref).catch(()=>{});return;}
      if(Math.abs(Date.now()-(d.ts||0))>90000)return;
      if(c==='alerts')alertBroadcast(d);else receiveRadio(d);});
    first=false;}));});
  subs.push(onSnapshot(collection(fdb,'bodycams'),snap=>{
    cache.bodycams=snap.docs.map(d=>({id:d.id,...d.data()}));
    Object.keys(bcViews).forEach(u=>{if(!cache.bodycams.find(b=>b.id===u))unwatchCam(u);});

}

let pendingRender=false;
function renderView(force){
  const ae=document.activeElement;
  if(force!==true&&ae&&main.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){pendingRender=true;renderTopbar();return;}
  const fid=(ae&&main.contains(ae))?ae.id:'',fpos=ae&&ae.selectionStart;
  renderTopbar();
  const cb=document.querySelector('#nav button[data-t="command"]');if(cb)cb.style.display=canCmd()?'':'none';
  if(state.tab==='command'&&!canCmd())state.tab='dash';
  document.querySelectorAll('#nav button[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===state.tab));
  main.innerHTML=views[state.tab]();
  if(state.tab==='bodycam')document.querySelectorAll('.bcslot').forEach(el=>{const v=el.dataset.local?(bcStream?bcLocal:null):bcVideos[el.dataset.uid];if(v){el.appendChild(v);v.play().catch(()=>{});}});
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(fpos,fpos);}catch(e){}}}
}
main.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(()=>renderView(true),0);}});
main.addEventListener('change',e=>{if(e.target.blur)e.target.blur();});
document.querySelectorAll('#nav button[data-t]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;renderView(true);});
window.renderView=renderView;

// ================= ACTIONS =================
window.setAnn=()=>{log('Announcement updated.');saveMeta({announcement:document.getElementById('ann').value});};
window.toggleOnline=()=>{const v=!meta.online;log('SAPD status changed to '+(v?'ONLINE':'OFFLINE')+'.');saveMeta({online:v});};
window.addMember=(e)=>{e.preventDefault();if(!canCmd())return false;const f=e.target;addDoc_('members',{name:f.name.value,cid:f.cid.value,phone:f.phone.value,callsign:f.callsign.value,badge:f.badge.value,rank:f.rank.value,division:f.division.value,promo:[]});log('New member added: '+f.name.value);done(f);return false;};
window.addMdt=(e)=>{e.preventDefault();const f=e.target;addDoc_('mdt',{name:f.name.value,wanted:f.wanted.value==='true',criminal:f.criminal.value,arrests:f.arrests.value,tickets:f.tickets.value,evidence:f.evidence.value,notes:f.notes.value,createdBy:me.uid});log('MDT record added for '+f.name.value);done(f);return false;};
window.addDispatch=(e)=>{e.preventDefault();const f=e.target;addDoc_('dispatch',{code:f.code.value,type:f.type.value,loc:f.loc.value,priority:f.priority.value,unit:f.unit.value,status:f.status.value,createdBy:me.uid,ts:Date.now(),alert:f.alert.value});log('New dispatch: '+f.code.value+' - '+f.type.value);done(f);return false;};
window.setDispStatus=(id,st)=>{updDoc_('dispatch',id,{status:st});};
window.addReport=(e)=>{e.preventDefault();const f=e.target;addDoc_('reports',{type:f.type.value,officer:f.officer.value,subject:f.subject.value,details:f.details.value,date:new Date().toLocaleString()});log('Report filed: '+f.type.value+' by '+f.officer.value);done(f);return false;};
window.addEquip=(e)=>{e.preventDefault();const f=e.target;addDoc_('equip',{item:f.item.value,cat:f.cat.value,status:f.status.value,holder:f.holder.value});done(f);return false;};
window.toggleEquip=(id)=>{const it=cache.equip.find(x=>x.id===id);const ns=it.status==='Available'?'Checked Out':'Available';log((ns==='Checked Out'?'Item checked out: ':'Item returned: ')+it.item);updDoc_('equip',id,{status:ns});};
window.addVeh=(e)=>{e.preventDefault();const f=e.target;addDoc_('vehicles',{unit:f.unit.value,model:f.model.value,status:f.status.value});done(f);return false;};
window.setVehStatus=(id,st)=>{const v=cache.vehicles.find(x=>x.id===id);log(v.unit+' → '+st);updDoc_('vehicles',id,{status:st});};
window.addTrainee=(e)=>{e.preventDefault();const f=e.target;addDoc_('academy',{name:f.name.value,status:f.status.value,score:f.score.value||'-'});done(f);return false;};
window.promote=(e,id)=>{e.preventDefault();if(!canCmd())return false;const rank=e.target.rank.value;if(!rank)return false;const m=cache.members.find(x=>x.id===id);const promo=[...(m.promo||[]),m.rank+' → '+rank+' ('+new Date().toLocaleDateString()+')'];log(m.name+' rank changed to '+rank);updDoc_('members',id,{rank,promo});return false;};
window.reassign=(id,div)=>{if(!div||!canCmd())return;const m=cache.members.find(x=>x.id===id);log(m.name+' moved to '+div);updDoc_('members',id,{division:div});};
window.addPunish=(e)=>{e.preventDefault();const f=e.target;const list=[{id:'p'+Date.now(),name:f.name.value,reason:f.reason.value},...admin.punish];log('Punishment: '+f.name.value+' - '+f.reason.value);saveAdmin({punish:list});done(f);return false;};
window.addLeave=(e)=>{e.preventDefault();const f=e.target;const list=[{id:'lv'+Date.now(),name:f.name.value,reason:f.reason.value},...admin.leave];saveAdmin({leave:list});done(f);return false;};
window.approveLeave=(id)=>{saveAdmin({leave:admin.leave.filter(l=>l.id!==id)});log('Leave request approved.');};
window.setDiv=(d)=>{state.div=d;renderView(true);};
window.setMyStatus=(st)=>{const p={status:st};
  if(me.status==='On Duty'&&me.dutyStart){p.dutyHours=Math.round(((+me.dutyHours||0)+(Date.now()-me.dutyStart)/36e5)*10)/10;p.dutyStart=null;}
  if(st==='On Duty')p.dutyStart=Date.now();
  updDoc_('users',me.uid,p).then(()=>log(me.name+' → '+st));};
window.setLink=(uid,mid)=>{if(!canCmd())return;updDoc_('users',uid,{memberId:mid});};
window.setRole=(uid,role)=>{if(!role||!isAdmin())return;updDoc_('users',uid,{role}).then(()=>log('Account role changed to '+role+'.'));};
window.setRank=(uid,rank)=>{if(!rank||!canCmd())return;updDoc_('users',uid,{rank}).then(()=>log('Account rank changed to '+rank+'.'));};
</script>
</body>
</html>
