<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAPD // Command System</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121820; --panel2:#161e28; --line:#233042;
  --amber:#f0a83c; --blue:#4c8fd6; --green:#3fb96f; --red:#e05a5a; --text:#dbe3ec; --dim:#7f8fa3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;min-height:100%}
.mono{font-family:'Consolas',monospace}
#nav{width:210px;background:var(--panel);border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;padding:14px 0;overflow-y:auto}
#nav .brand{padding:0 16px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
#nav .brand b{color:var(--amber);font-size:19px;letter-spacing:.5px}
#nav .brand div{color:var(--dim);font-size:11px;margin-top:2px}
#nav button{all:unset;cursor:pointer;padding:10px 16px;font-size:14px;color:var(--dim);border-left:3px solid transparent}
#nav button:hover{background:var(--panel2);color:var(--text)}
#nav button.active{background:var(--panel2);color:var(--amber);border-left-color:var(--amber)}
#nav .logout{margin-top:auto;padding:10px 16px;color:var(--red);cursor:pointer;font-size:13px;border-top:1px solid var(--line)}
main{flex:1;padding:22px 26px;overflow-y:auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.card .n{font-size:26px;font-weight:700}
.card .l{color:var(--dim);font-size:12px;margin-top:2px}
.status-on{color:var(--green)} .status-off{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:var(--panel2)}
.tblwrap{overflow-x:auto;margin-bottom:18px}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;display:inline-block}
.pill.duty{background:#123a24;color:var(--green)} .pill.off{background:#2a2a2a;color:var(--dim)}
.pill.leave{background:#3a2f10;color:var(--amber)} .pill.high{background:#3a1414;color:var(--red)}
.pill.med{background:#3a2f10;color:var(--amber)} .pill.low{background:#123a24;color:var(--green)}
.pill.active{background:#3a1414;color:var(--red)} .pill.avail{background:#123a24;color:var(--green)}
.pill.use{background:#3a2f10;color:var(--amber)} .pill.maint{background:#232323;color:var(--dim)}
.pill.pending{background:#3a1414;color:var(--red)} .pill.officer{background:#123a24;color:var(--green)} .pill.admin{background:#123a5a;color:var(--blue)}
form.inline{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:4px;font-size:13px;font-family:inherit}
textarea{width:100%;min-height:50px}
button.btn{background:var(--amber);color:#241a06;border:none;padding:7px 14px;border-radius:4px;font-weight:600;cursor:pointer;font-size:13px}
button.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.del{cursor:pointer;color:var(--red);font-size:12px}
.divtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.divtabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:14px;cursor:pointer;font-size:12px}
.divtabs button.on{background:var(--amber);color:#241a06;border-color:var(--amber)}
.note{color:var(--dim);font-size:12px;margin:8px 0}
#topbar{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin-bottom:16px;font-size:12px;color:var(--dim)}
#topbar b{color:var(--text)}
.rolepill{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.role-admin{background:#123a5a;color:var(--blue)} .role-officer{background:#123a24;color:var(--green)}
.ro-banner{background:#3a2f10;border:1px solid var(--amber);color:var(--amber);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px}
#authwrap{flex:1;display:flex;align-items:center;justify-content:center}
#authbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;width:100%;max-width:340px}
#authbox h2{margin:0 0 4px;color:var(--amber)}
#authbox input{width:100%;margin-bottom:10px}
#authbox button{width:100%}
#autherr{color:var(--red);font-size:12px;margin:6px 0}
.switch{color:var(--dim);font-size:12px;margin-top:10px;cursor:pointer;text-align:center}
</style>
</head>
<body>
<div id="authwrap" style="display:none">
  <div id="authbox"></div>
</div>
<nav id="nav" style="display:none">
  <div class="brand"><b>🚔 SAPD</b><div>Command System</div></div>
  <button data-t="dash" class="active">Dashboard</button>
  <button data-t="members">Data Anggota</button>
  <button data-t="mdt">MDT Database</button>
  <button data-t="dispatch">Dispatch</button>
  <button data-t="reports">Laporan Polisi</button>
  <button data-t="divisions">Division</button>
  <button data-t="equip">Equipment / Armory</button>
  <button data-t="vehicles">Vehicle</button>
  <button data-t="academy">Academy</button>
  <button data-t="command">Command Panel</button>
  <div class="logout" onclick="doLogout()">Logout</div>
</nav>
<main id="main" style="display:none">
<div id="topbar"></div>
<div id="content"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, deleteDoc, addDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// >>> GANTI dengan config project Firebase kamu sendiri (Project Settings > SDK setup) <<<
const firebaseConfig = {
  apiKey: "AIzaSyDnVNbwNlCJTBB-ksAbAXAMqlwQ8P4W52g",
  authDomain: "sapd-command.firebaseapp.com",
  projectId: "sapd-command",
  storageBucket: "sapd-command.firebasestorage.app",
  messagingSenderId: "715047128051",
  appId: "1:715047128051:web:b0559917d35c8f5a05e086"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const fdb = getFirestore(app);

const DIVS=["Patrol Division","Traffic Division","Detective Division","SWAT","Internal Affairs","Training Division","Communications"];
const COLS=["members","mdt","dispatch","reports","equip","vehicles","academy"];
let cache={members:[],mdt:[],dispatch:[],reports:[],equip:[],vehicles:[],academy:[],users:[]};
let meta={online:true,announcement:"Selamat datang di sistem SAPD. Patuhi SOP setiap saat.",activity:["Sistem diinisialisasi."]};
let admin={punish:[],leave:[]};
let me={uid:null,name:"",role:"pending"};
let subs=[];
function esc(s){return (s||"").toString().replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}

// ---------- AUTH ----------
window.authState={mode:'login'};
function renderAuth(err){
  document.getElementById('authwrap').style.display='flex';
  document.getElementById('nav').style.display='none';
  document.getElementById('main').style.display='none';
  const box=document.getElementById('authbox');
  box.innerHTML = authState.mode==='login' ? `
    <h2>🚔 SAPD Login</h2><div class="sub">Masuk pakai akun officer kamu.</div>
    <div id="autherr">${err||''}</div>
    <input id="a_email" type="email" placeholder="Email">
    <input id="a_pass" type="password" placeholder="Password">
    <button class="btn" onclick="doLogin()">Login</button>
    <div class="switch" onclick="authState.mode='signup';renderAuthWin()">Belum punya akun? Daftar</div>` : `
    <h2>🚔 Daftar Akun</h2><div class="sub">Akun baru menunggu persetujuan admin sebelum bisa dipakai.</div>
    <div id="autherr">${err||''}</div>
    <input id="a_name" placeholder="Nama karakter">
    <input id="a_email" type="email" placeholder="Email">
    <input id="a_pass" type="password" placeholder="Password (min 6 karakter)">
    <button class="btn" onclick="doSignup()">Daftar</button>
    <div class="switch" onclick="authState.mode='login';renderAuthWin()">Sudah punya akun? Login</div>`;
}
window.renderAuthWin=renderAuth;
window.doLogin=async function(){
  try{ await signInWithEmailAndPassword(auth,document.getElementById('a_email').value,document.getElementById('a_pass').value); }
  catch(e){ renderAuth('Login gagal: '+e.code); }
};
window.doSignup=async function(){
  try{
    const name=document.getElementById('a_name').value||'Officer';
    const cred=await createUserWithEmailAndPassword(auth,document.getElementById('a_email').value,document.getElementById('a_pass').value);
    await setDoc(doc(fdb,'users',cred.user.uid),{name,email:cred.user.email,role:'pending'});
  }catch(e){ renderAuth('Daftar gagal: '+e.code); }
};
window.doLogout=function(){ subs.forEach(u=>u()); subs=[]; signOut(auth); };

// ---------- DATA WIRING ----------
function subscribeAll(){
  subs.forEach(u=>u()); subs=[];
  COLS.forEach(c=>subs.push(onSnapshot(collection(fdb,c),snap=>{cache[c]=snap.docs.map(d=>({id:d.id,...d.data()}));renderView();})));
  subs.push(onSnapshot(collection(fdb,'users'),snap=>{cache.users=snap.docs.map(d=>({id:d.id,...d.data()}));renderView();}));
  subs.push(onSnapshot(doc(fdb,'meta','app'),s=>{if(s.exists())meta={...meta,...s.data()};renderView();}));
  subs.push(onSnapshot(doc(fdb,'admin_log','log'),s=>{if(s.exists())admin={...admin,...s.data()};renderView();}));
}
onAuthStateChanged(auth,user=>{
  subs.forEach(u=>u()); subs=[];
  if(!user){ renderAuth(); return; }
  onSnapshot(doc(fdb,'users',user.uid),s=>{
    if(!s.exists()){ me={uid:user.uid,name:user.email,role:'pending'}; }
    else{ me={uid:user.uid,...s.data()}; }
    if(me.role==='pending'){
      document.getElementById('authwrap').style.display='flex';
      document.getElementById('nav').style.display='none';
      document.getElementById('main').style.display='none';
      document.getElementById('authbox').innerHTML=`<h2>⏳ Menunggu Persetujuan</h2><div class="sub">Akun kamu (${esc(me.name)}) sudah terdaftar tapi belum di-approve admin. Minta admin buka Command Panel > Kelola Akun.</div><button class="btn sec" onclick="doLogout()">Logout</button>`;
    } else {
      document.getElementById('authwrap').style.display='none';
      document.getElementById('nav').style.display='flex';
      document.getElementById('main').style.display='block';
      subscribeAll();
      renderView();
    }
  });
});

// ---------- WRITE HELPERS ----------
async function addDoc_(col,obj){ await addDoc(collection(fdb,col),obj); }
async function delDoc_(col,id){ await deleteDoc(doc(fdb,col,id)); }
async function updDoc_(col,id,patch){ await updateDoc(doc(fdb,col,id),patch); }
async function saveMeta(patch){ meta={...meta,...patch}; await setDoc(doc(fdb,'meta','app'),meta); }
async function saveAdmin(patch){ admin={...admin,...patch}; await setDoc(doc(fdb,'admin_log','log'),admin); }
function log(msg){ saveMeta({activity:[msg,...meta.activity].slice(0,8)}); }
window.delDoc=delDoc_;

const main=document.getElementById('content');
const topbar=document.getElementById('topbar');
let state={tab:'dash',div:DIVS[0]};
const canWrite=()=>me.role==='officer'||me.role==='admin';
const isAdmin=()=>me.role==='admin';

function roleBadge(){ return isAdmin()?'<span class="rolepill role-admin">Admin</span>':'<span class="rolepill role-officer">Officer</span>'; }
function renderTopbar(){ topbar.innerHTML=`<div>Login sebagai: <b>${esc(me.name)}</b></div><div>${roleBadge()}</div>`; }
function roForm(){ return ''; }
function adminOnly(html){ return isAdmin()?html:'<div class="ro-banner">Bagian ini khusus role Admin.</div>'; }

const views={
dash(){
  const duty=cache.members.filter(m=>m.status==="Duty").length;
  const avail=cache.vehicles.filter(v=>v.status==="Available").length;
  return `<h1>Dashboard</h1><div class="sub">Ringkasan operasional SAPD saat ini.</div>
  <div class="grid">
    <div class="card"><div class="n ${meta.online?'status-on':'status-off'}">${meta.online?'🟢 ONLINE':'🔴 OFFLINE'}</div><div class="l">Status SAPD</div></div>
    <div class="card"><div class="n">${cache.members.length}</div><div class="l">Anggota Aktif</div></div>
    <div class="card"><div class="n">${duty}</div><div class="l">Sedang Duty</div></div>
    <div class="card"><div class="n">${avail}</div><div class="l">Kendaraan Tersedia</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><b>📢 Pengumuman Terbaru</b>
    <textarea id="ann" style="margin-top:8px">${esc(meta.announcement)}</textarea>
    <div style="margin-top:8px"><button class="btn sec" onclick="setAnn()">Simpan Pengumuman</button>
    <button class="btn sec" onclick="toggleOnline()">Toggle Status ${meta.online?'Offline':'Online'}</button></div>
  </div>
  <div class="card"><b>🕓 Aktivitas Terakhir</b><ul>${meta.activity.map(a=>`<li class="note">${esc(a)}</li>`).join('')}</ul></div>`;
},
members(){
  return `<h1>Data Anggota</h1><div class="sub">Roster lengkap anggota SAPD.</div>
  <form class="inline" onsubmit="return addMember(event)">
    <input name="name" placeholder="Nama karakter" required><input name="rank" placeholder="Rank" required>
    <select name="division">${DIVS.map(d=>`<option>${d}</option>`).join('')}</select>
    <input name="badge" placeholder="Badge/ID" required>
    <select name="status"><option>Duty</option><option>Off Duty</option><option>Leave</option></select>
    <input name="hours" type="number" placeholder="Jam duty" value="0"><button class="btn">Tambah Anggota</button>
  </form>
  <div class="tblwrap"><table><tr><th>Nama</th><th>Rank</th><th>Division</th><th>Badge</th><th>Status</th><th>Jam Duty</th><th>Riwayat</th><th></th></tr>
  ${cache.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.rank)}</td><td>${esc(m.division)}</td><td class="mono">${esc(m.badge)}</td>
  <td><span class="pill ${m.status==='Duty'?'duty':m.status==='Leave'?'leave':'off'}">${m.status}</span></td>
  <td>${m.dutyHours}h</td><td class="note">${(m.promo||[]).join('; ')||'-'}</td>
  <td><span class="del" onclick="delDoc('members','${m.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
mdt(){
  const q=(document.getElementById('mdtsearch')?.value||'').toLowerCase();
  return `<h1>MDT / Police Database</h1><div class="sub">Cari nama pemain untuk melihat catatan kriminal.</div>
  <input id="mdtsearch" placeholder="Cari nama pemain..." oninput="renderView()" style="margin-bottom:14px;width:100%;max-width:320px">
  <form class="inline" onsubmit="return addMdt(event)">
    <input name="name" placeholder="Nama pemain" required>
    <select name="wanted"><option value="false">Not Wanted</option><option value="true">Wanted</option></select>
    <input name="criminal" placeholder="Criminal record"><input name="arrests" placeholder="Arrest history">
    <input name="tickets" placeholder="Ticket history"><input name="evidence" placeholder="Barang bukti">
    <textarea name="notes" placeholder="Catatan officer"></textarea><button class="btn">Tambah Record</button>
  </form>
  <div class="tblwrap"><table><tr><th>Nama</th><th>Wanted</th><th>Criminal Record</th><th>Arrest</th><th>Ticket</th><th>Evidence</th><th>Notes</th><th></th></tr>
  ${cache.mdt.filter(r=>r.name.toLowerCase().includes(q)).map(r=>`<tr><td>${esc(r.name)}</td>
  <td>${r.wanted?'<span class="pill high">WANTED</span>':'<span class="pill low">Clear</span>'}</td>
  <td class="note">${esc(r.criminal)||'-'}</td><td class="note">${esc(r.arrests)||'-'}</td><td class="note">${esc(r.tickets)||'-'}</td>
  <td class="note">${esc(r.evidence)||'-'}</td><td class="note">${esc(r.notes)||'-'}</td>
  <td><span class="del" onclick="delDoc('mdt','${r.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
dispatch(){
  return `<h1>Dispatch</h1><div class="sub">Panggilan aktif dan riwayat dispatch.</div>
  <form class="inline" onsubmit="return addDispatch(event)">
    <input name="code" placeholder="Kode (10-31)" required><input name="type" placeholder="Jenis (Robbery)" required>
    <input name="loc" placeholder="Lokasi" required>
    <select name="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select>
    <input name="unit" placeholder="Unit (Adam-21, Charlie-14)">
    <select name="status"><option>ACTIVE</option><option>RESPONDING</option><option>CLOSED</option></select>
    <button class="btn">Buat Dispatch</button>
  </form>
  <div class="tblwrap"><table><tr><th>Kode</th><th>Jenis</th><th>Lokasi</th><th>Prioritas</th><th>Unit</th><th>Status</th><th></th></tr>
  ${cache.dispatch.map(d=>`<tr><td class="mono">${esc(d.code)}</td><td>${esc(d.type)}</td><td>${esc(d.loc)}</td>
  <td><span class="pill ${d.priority==='HIGH'?'high':d.priority==='MEDIUM'?'med':'low'}">${d.priority}</span></td>
  <td>${esc(d.unit)}</td><td><span class="pill ${d.status==='ACTIVE'?'active':'avail'}">${d.status}</span></td>
  <td><span class="del" onclick="delDoc('dispatch','${d.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
reports(){
  const types=["Arrest Report","Incident Report","Traffic Report","Evidence Report","Use of Force Report"];
  return `<h1>Laporan Polisi</h1><div class="sub">Buat dan lihat laporan resmi officer.</div>
  <form class="inline" onsubmit="return addReport(event)">
    <select name="type">${types.map(t=>`<option>${t}</option>`).join('')}</select>
    <input name="officer" placeholder="Nama officer" required><input name="subject" placeholder="Subjek/tersangka">
    <textarea name="details" placeholder="Detail laporan" required></textarea><button class="btn">Submit Laporan</button>
  </form>
  <div class="tblwrap"><table><tr><th>Tanggal</th><th>Jenis</th><th>Officer</th><th>Subjek</th><th>Detail</th><th></th></tr>
  ${cache.reports.map(r=>`<tr><td class="note">${esc(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.officer)}</td><td>${esc(r.subject)||'-'}</td>
  <td class="note">${esc(r.details)}</td><td><span class="del" onclick="delDoc('reports','${r.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
divisions(){
  const list=cache.members.filter(m=>m.division===state.div);
  return `<h1>Division</h1><div class="sub">Anggota per divisi.</div>
  <div class="divtabs">${DIVS.map(d=>`<button class="${d===state.div?'on':''}" onclick="setDiv('${d.replace(/'/g,"")}')">${d}</button>`).join('')}</div>
  <div class="tblwrap"><table><tr><th>Nama</th><th>Rank</th><th>Badge</th><th>Status</th><th>Jam Duty</th></tr>
  ${list.length?list.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.rank)}</td><td class="mono">${esc(m.badge)}</td>
  <td><span class="pill ${m.status==='Duty'?'duty':m.status==='Leave'?'leave':'off'}">${m.status}</span></td><td>${m.dutyHours}h</td></tr>`).join('')
  :'<tr><td colspan="5" class="note">Belum ada anggota di divisi ini.</td></tr>'}
  </table></div>`;
},
equip(){
  return `<h1>Equipment / Armory</h1><div class="sub">Inventaris senjata, armor, radio, evidence kit, kendaraan.</div>
  <form class="inline" onsubmit="return addEquip(event)">
    <input name="item" placeholder="Nama item" required>
    <select name="cat"><option>Senjata</option><option>Armor</option><option>Radio</option><option>Evidence Kit</option><option>Vehicle</option></select>
    <select name="status"><option>Available</option><option>Dipinjam</option></select>
    <input name="holder" placeholder="Diambil oleh (jika dipinjam)"><button class="btn">Tambah Item</button>
  </form>
  <div class="tblwrap"><table><tr><th>Item</th><th>Kategori</th><th>Status</th><th>Dipegang oleh</th><th></th></tr>
  ${cache.equip.map(e=>`<tr><td>${esc(e.item)}</td><td>${esc(e.cat)}</td>
  <td><span class="pill ${e.status==='Available'?'avail':'use'}">${e.status}</span></td><td>${esc(e.holder)||'-'}</td>
  <td><span class="del" onclick="toggleEquip('${e.id}')">Toggle</span> &nbsp;<span class="del" onclick="delDoc('equip','${e.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
vehicles(){
  return `<h1>Vehicle Management</h1><div class="sub">Status armada kendaraan SAPD.</div>
  <form class="inline" onsubmit="return addVeh(event)">
    <input name="unit" placeholder="Unit code (SAPD-04)" required><input name="model" placeholder="Model" required>
    <select name="status"><option>Available</option><option>In Use</option><option>Maintenance</option></select>
    <button class="btn">Tambah Kendaraan</button>
  </form>
  <div class="tblwrap"><table><tr><th>Unit</th><th>Model</th><th>Status</th><th></th></tr>
  ${cache.vehicles.map(v=>`<tr><td class="mono">${esc(v.unit)}</td><td>${esc(v.model)}</td>
  <td><span class="pill ${v.status==='Available'?'avail':v.status==='In Use'?'use':'maint'}">${v.status}</span></td>
  <td><span class="del" onclick="delDoc('vehicles','${v.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
academy(){
  return `<h1>Academy</h1><div class="sub">Pendaftaran, pelatihan, dan kelulusan trainee.</div>
  <form class="inline" onsubmit="return addTrainee(event)">
    <input name="name" placeholder="Nama trainee" required>
    <select name="status"><option>Registered</option><option>In Training</option><option>Graduated</option><option>Failed</option></select>
    <input name="score" placeholder="Nilai ujian"><button class="btn">Daftarkan Trainee</button>
  </form>
  <div class="note">Materi: Hukum Dasar, SOP Patroli, Penggunaan Senjata, Pertolongan Pertama. Jadwal training: setiap Sabtu 20:00 server time.</div>
  <div class="tblwrap"><table><tr><th>Nama</th><th>Status</th><th>Nilai Ujian</th><th></th></tr>
  ${cache.academy.map(a=>`<tr><td>${esc(a.name)}</td><td><span class="pill ${a.status==='Graduated'?'avail':a.status==='Failed'?'high':'med'}">${a.status}</span></td>
  <td>${esc(a.score)}</td><td><span class="del" onclick="delDoc('academy','${a.id}')">Hapus</span></td></tr>`).join('')}
  </table></div>`;
},
command(){
  const body=`<div class="tblwrap"><table><tr><th>Nama</th><th>Rank</th><th>Division</th><th>Promosi/Demosi (rank baru)</th><th>Pindah Divisi</th></tr>
  ${cache.members.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.rank)}</td><td>${esc(m.division)}</td>
  <td><form class="inline" style="margin:0;padding:0;background:none;border:none" onsubmit="return promote(event,'${m.id}')"><input name="rank" placeholder="Rank baru" style="width:110px"><button class="btn sec" style="padding:5px 10px">Set</button></form></td>
  <td><select onchange="reassign('${m.id}',this.value)"><option value="">-pilih-</option>${DIVS.map(d=>`<option ${d===m.division?'selected':''}>${d}</option>`).join('')}</select></td></tr>`).join('')}
  </table></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><b>⚠️ Punishment Log</b>
      <form class="inline" onsubmit="return addPunish(event)"><input name="name" placeholder="Nama" required><input name="reason" placeholder="Alasan" required><button class="btn sec">Catat</button></form>
      <ul>${admin.punish.map(p=>`<li class="note">${esc(p.name)} — ${esc(p.reason)}</li>`).join('')||'<li class="note">Belum ada catatan.</li>'}</ul>
    </div>
    <div class="card"><b>📋 Leave Requests</b>
      <form class="inline" onsubmit="return addLeave(event)"><input name="name" placeholder="Nama" required><input name="reason" placeholder="Alasan" required><button class="btn sec">Ajukan</button></form>
      <ul>${admin.leave.map(l=>`<li class="note">${esc(l.name)} — ${esc(l.reason)} <span class="del" onclick="approveLeave('${l.id}')">Setujui</span></li>`).join('')||'<li class="note">Tidak ada pengajuan.</li>'}</ul>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><b>👤 Kelola Akun</b><div class="note">Approve akun baru & atur permission (role) tiap anggota.</div>
  <div class="tblwrap"><table><tr><th>Nama</th><th>Email</th><th>Role</th><th>Ubah</th></tr>
  ${cache.users.map(u=>`<tr><td>${esc(u.name)}</td><td class="note">${esc(u.email)}</td><td><span class="pill ${u.role}">${u.role}</span></td>
  <td><select onchange="setRole('${u.id}',this.value)"><option value="">-pilih-</option><option value="pending">pending (tanpa akses)</option><option value="officer">officer (akses normal)</option><option value="admin">admin (akses penuh)</option></select></td></tr>`).join('')}
  </table></div></div>
  <div class="card" style="margin-top:16px"><b>🕓 Activity Log</b><ul>${meta.activity.map(a=>`<li class="note">${esc(a)}</li>`).join('')}</ul></div>`;
  return `<h1>Command Panel</h1><div class="sub">Khusus role Admin — promosi, roster, punishment, leave, kelola akun.</div>${adminOnly(body)}`;
}
};

function renderView(){
  renderTopbar();
  document.querySelectorAll('#nav button[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===state.tab));
  main.innerHTML=views[state.tab]();
}
document.querySelectorAll('#nav button[data-t]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;renderView();});
window.renderView=renderView;

window.setAnn=()=>{log('Pengumuman diperbarui.');saveMeta({announcement:document.getElementById('ann').value});};
window.toggleOnline=()=>{const v=!meta.online;log('Status SAPD diubah menjadi '+(v?'ONLINE':'OFFLINE')+'.');saveMeta({online:v});};
window.addMember=(e)=>{e.preventDefault();const f=e.target;addDoc_('members',{name:f.name.value,rank:f.rank.value,division:f.division.value,badge:f.badge.value,status:f.status.value,dutyHours:+f.hours.value||0,promo:[]});log('Anggota baru ditambahkan: '+f.name.value);f.reset();return false;};
window.addMdt=(e)=>{e.preventDefault();const f=e.target;addDoc_('mdt',{name:f.name.value,wanted:f.wanted.value==='true',criminal:f.criminal.value,arrests:f.arrests.value,tickets:f.tickets.value,evidence:f.evidence.value,notes:f.notes.value});log('Record MDT ditambahkan untuk '+f.name.value);f.reset();return false;};
window.addDispatch=(e)=>{e.preventDefault();const f=e.target;addDoc_('dispatch',{code:f.code.value,type:f.type.value,loc:f.loc.value,priority:f.priority.value,unit:f.unit.value,status:f.status.value});log('Dispatch baru: '+f.code.value+' - '+f.type.value);f.reset();return false;};
window.addReport=(e)=>{e.preventDefault();const f=e.target;addDoc_('reports',{type:f.type.value,officer:f.officer.value,subject:f.subject.value,details:f.details.value,date:new Date().toLocaleString()});log('Laporan dibuat: '+f.type.value+' oleh '+f.officer.value);f.reset();return false;};
window.addEquip=(e)=>{e.preventDefault();const f=e.target;addDoc_('equip',{item:f.item.value,cat:f.cat.value,status:f.status.value,holder:f.holder.value});f.reset();return false;};
window.toggleEquip=(id)=>{const it=cache.equip.find(x=>x.id===id);const ns=it.status==='Available'?'Dipinjam':'Available';log((ns==='Dipinjam'?'Item diambil: ':'Item dikembalikan: ')+it.item);updDoc_('equip',id,{status:ns});};
window.addVeh=(e)=>{e.preventDefault();const f=e.target;addDoc_('vehicles',{unit:f.unit.value,model:f.model.value,status:f.status.value});f.reset();return false;};
window.addTrainee=(e)=>{e.preventDefault();const f=e.target;addDoc_('academy',{name:f.name.value,status:f.status.value,score:f.score.value||'-'});f.reset();return false;};
window.promote=(e,id)=>{e.preventDefault();const rank=e.target.rank.value;if(!rank)return false;const m=cache.members.find(x=>x.id===id);const promo=[...(m.promo||[]),m.rank+' → '+rank+' ('+new Date().toLocaleDateString()+')'];log(m.name+' rank diubah menjadi '+rank);updDoc_('members',id,{rank,promo});return false;};
window.reassign=(id,div)=>{if(!div)return;const m=cache.members.find(x=>x.id===id);log(m.name+' dipindah ke '+div);updDoc_('members',id,{division:div});};
window.addPunish=(e)=>{e.preventDefault();const f=e.target;const list=[{id:'p'+Date.now(),name:f.name.value,reason:f.reason.value},...admin.punish];log('Punishment: '+f.name.value+' - '+f.reason.value);saveAdmin({punish:list});f.reset();return false;};
window.addLeave=(e)=>{e.preventDefault();const f=e.target;const list=[{id:'lv'+Date.now(),name:f.name.value,reason:f.reason.value},...admin.leave];saveAdmin({leave:list});f.reset();return false;};
window.approveLeave=(id)=>{saveAdmin({leave:admin.leave.filter(l=>l.id!==id)});log('Leave request disetujui.');};
window.setDiv=(d)=>{state.div=d;renderView();};
window.setRole=(uid,role)=>{if(!role)return;updDoc_('users',uid,{role}).then(()=>log('Role diubah menjadi '+role+' untuk 1 akun.'));};
</script>
</body>
</html>
